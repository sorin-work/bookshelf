{{define "content"}}
<div class="narrow">
  <h1>Log in</h1>
  <form method="post" action="/login" class="card" novalidate>
    {{template "csrf" .}}
    {{with index .Data.Errors "form"}}<p class="alert error">{{.}}</p>{{end}}
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{.Data.Email}}" autocomplete="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="/signup">Create an account</a></p>
</div>
{{end}}
