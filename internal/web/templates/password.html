{{define "content"}}
{{$f := .Data}}
<div class="narrow">
  <h1>Change password</h1>
  <form method="post" action="/account/password" class="card" novalidate>
    {{template "csrf" .}}
    <div class="field">
      <label for="current">Current password</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required>
      {{template "field_error" index $f.Errors "current"}}
    </div>
    <div class="field">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      {{template "field_error" index $f.Errors "password"}}
    </div>
    <div class="field">
      <label for="confirm">New password again</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
      {{template "field_error" index $f.Errors "confirm"}}
    </div>
    <div class="actions">
      <button type="submit">Change password</button>
      <a class="button secondary" href="/account">Cancel</a>
    </div>
  </form>
</div>
{{end}}
