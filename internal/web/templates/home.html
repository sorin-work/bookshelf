{{define "content"}}
<section class="hero">
  <h1>Your library, on one shelf</h1>
  <p>Keep track of every book, every copy and every loan. Members can search the catalogue,
     place holds and see what they have out.</p>
  <form method="get" action="/catalogue" class="search" role="search">
    <label for="q" class="visually-hidden">Search the catalogue</label>
    <input id="q" name="q" type="search" placeholder="Search by title, author or ISBN">
    <button type="submit">Search</button>
  </form>
</section>
{{end}}
